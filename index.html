
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORION // AI SYSTEM</title>

<style>
:root {
    --orange: #ff781f;
    --bright: #ff9b42;
    --dark: #090b0e;
    --panel: #11151a;
    --border: #30251d;
    --text: #e9e9e9;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    background: var(--dark);
    color: var(--text);
    font-family: 'Segoe UI', sans-serif;
}

/* BACKGROUND */

body:before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
    radial-gradient(ellipse at 50% 45%,
    #ff781f0b, transparent 60%);
}

/* SIDEBAR */

.sidebar {
    width: 250px;
    background: #0d1014;
    border-right: 1px solid var(--border);
    padding: 25px 18px;
    display: flex;
    flex-direction: column;
    z-index: 2;
}

.logo {
    font-size: 23px;
    font-weight: 800;
    letter-spacing: 4px;
    color: var(--orange);
    margin-bottom: 5px;
}

.subtitle {
    color: #6f747b;
    font-size: 9px;
    letter-spacing: 3px;
    margin-bottom: 35px;
}

.new-chat {
    padding: 13px;
    background: #ff781f12;
    border: 1px solid #ff781f55;
    color: var(--orange);
    cursor: pointer;
    letter-spacing: 1px;
    text-align: left;
    transition: .2s;
}

.new-chat:hover {
    background: #ff781f25;
    box-shadow: 0 0 15px #ff781f22;
}

.sidebar-label {
    color: #555c63;
    font-size: 10px;
    letter-spacing: 2px;
    margin-top: 35px;
}

.system-status {
    margin-top: auto;
    border-top: 1px solid var(--border);
    padding-top: 20px;
    font-size: 11px;
    color: #81878e;
}

.dot {
    display: inline-block;
    height: 7px;
    width: 7px;
    background: var(--orange);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--orange);
    margin-right: 8px;
}

/* MAIN */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

header {
    height: 65px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    background: #0d1014cc;
}

.header-title {
    font-size: 11px;
    letter-spacing: 3px;
    color: #a9adb2;
}

.header-status {
    font-size: 10px;
    color: var(--orange);
    letter-spacing: 2px;
}

/* CHAT */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 35px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.welcome {
    margin: auto;
    text-align: center;
    padding: 30px;
}

.core {
    width: 100px;
    height: 100px;
    margin: 0 auto 30px;
    border: 1px solid var(--orange);
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--orange);
    font-size: 35px;
    box-shadow: 0 0 25px #ff781f33,
                inset 0 0 20px #ff781f18;
    animation: pulse 3s infinite;
}

@keyframes pulse {
    50% {
        box-shadow: 0 0 45px #ff781f55,
                    inset 0 0 25px #ff781f33;
    }
}

.welcome h1 {
    font-size: 27px;
    letter-spacing: 5px;
    font-weight: 400;
}

.welcome p {
    color: #747a81;
    font-size: 12px;
    letter-spacing: 2px;
}

.message {
    width: min(750px, 100%);
    padding: 17px 20px;
    margin: 10px auto;
    border-left: 2px solid var(--orange);
    background: #15191e;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
}

.user {
    border-left-color: #686e76;
    background: #1b1f25;
}

/* INPUT */

.input-area {
    padding: 20px;
    display: flex;
    justify-content: center;
    background: linear-gradient(transparent, #0d1014);
}

.input-wrapper {
    width: min(750px, 100%);
    display: flex;
    border: 1px solid #5a3822;
    background: #11151a;
    transition: .2s;
}

.input-wrapper:focus-within {
    border-color: var(--orange);
    box-shadow: 0 0 18px #ff781f20;
}

input {
    flex: 1;
    min-width: 0;
    padding: 18px;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 14px;
}

input::placeholder {
    color: #555c63;
}

.send {
    padding: 0 25px;
    border: none;
    background: var(--orange);
    color: #090b0e;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
}

.send:hover {
    background: var(--bright);
}

/* MOBILE */

@media(max-width: 650px) {
    .sidebar { width: 65px; padding: 15px 8px; }
    .logo { font-size: 12px; letter-spacing: 1px; }
    .subtitle, .new-chat, .sidebar-label,
    .system-status { display: none; }
    header { padding: 0 15px; }
    .welcome h1 { font-size: 20px; }
}
</style>
</head>

<body>

<aside class="sidebar">

    <div class="logo">ORION</div>
    <div class="subtitle">ARTIFICIAL INTELLIGENCE</div>

    <button class="new-chat" onclick="newChat()">
        + NEW SESSION
    </button>

    <div class="sidebar-label">CONVERSATIONS</div>

    <div class="system-status">
        <span class="dot"></span>
        INTERFACE ONLINE
        <br><br>
        AI CORE: NOT CONNECTED
    </div>

</aside>

<main class="main">

    <header>
        <div class="header-title">ORION // INTERFACE</div>
        <div class="header-status">● SYSTEM READY</div>
    </header>

    <div class="chat" id="chat">

        <div class="welcome" id="welcome">
            <div class="core">◈</div>
            <h1>ORION</h1>
            <p>YOUR INTELLIGENCE. YOUR SYSTEM.</p>
            <p>AWAITING CONNECTION TO AI CORE...</p>
        </div>

    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input
                id="message"
                placeholder="Enter command..."
                onkeydown="if(event.key==='Enter') sendMessage()"
            >
            <button class="send" onclick="sendMessage()">
                SEND
            </button>
        </div>
    </div>

</main>


<script>
async function sendMessage() {
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");
    const text = input.value.trim();

    if (!text) return;

    document.getElementById("welcome")?.remove();

    // Display your message
    const userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.textContent = "YOU // " + text;
    chat.appendChild(userMessage);

    input.value = "";

    // Loading indicator
    const loading = document.createElement("div");
    loading.className = "message";
    loading.textContent = "ORION // THINKING...";
    chat.appendChild(loading);

    chat.scrollTop = chat.scrollHeight;

    try {
        const response = await fetch(
            "http://127.0.0.1:5000/chat",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: text
                })
            }
        );

        const data = await response.json();

        loading.textContent = response.ok
            ? "ORION // " + data.reply
            : "ERROR // " + data.error;

    } catch (error) {
        loading.textContent =
            "CONNECTION ERROR // Could not reach ORION's brain.";
    }

    chat.scrollTop = chat.scrollHeight;
}

function newChat() {
    document.getElementById("chat").innerHTML = `
        <div class="welcome" id="welcome">
            <div class="core">◈</div>
            <h1>ORION</h1>
            <p>YOUR INTELLIGENCE. YOUR SYSTEM.</p>
            <p>AWAITING CONNECTION TO AI CORE...</p>
        </div>
    `;
}
</script>


</body>
</html>
