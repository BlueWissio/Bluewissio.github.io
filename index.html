
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111216;
    color: white;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
}

.sidebar {
    width: 240px;
    background: #191a20;
    padding: 20px;
    border-right: 1px solid #303139;
}

.sidebar h2 {
    margin-top: 5px;
}

.new-chat {
    width: 100%;
    padding: 12px;
    background: #292a33;
    border: 1px solid #41424c;
    border-radius: 8px;
    color: white;
    cursor: pointer;
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

header {
    padding: 20px;
    border-bottom: 1px solid #303139;
    font-size: 18px;
}

.chat {
    flex: 1;
    padding: 25px;
    overflow-y: auto;
}

.message {
    background: #22232b;
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 15px;
    max-width: 650px;
    line-height: 1.5;
}

.user {
    background: #343542;
    margin-left: auto;
}

.input-area {
    padding: 20px;
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #41424c;
    background: #22232b;
    color: white;
    outline: none;
}

.send {
    padding: 0 22px;
    background: #7774db;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

@media(max-width: 600px) {
    .sidebar {
        display: none;
    }
}
</style>
</head>

<body>

<aside class="sidebar">
    <h2>MY AI</h2>
    <button class="new-chat" onclick="newChat()">+ New Chat</button>
</aside>

<main class="main">
    <header>My AI</header>

    <div class="chat" id="chat">
        <div class="message">
            Hello! I'm your AI. What would you like to talk about?
        </div>
    </div>

    <div class="input-area">
        <input id="message" placeholder="Message your AI..."
        onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="send" onclick="sendMessage()">Send</button>
    </div>
</main>

<script>
function sendMessage() {
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");
    const text = input.value.trim();

    if (!text) return;

    const message = document.createElement("div");
    message.className = "message user";
    message.textContent = text;

    chat.appendChild(message);
    input.value = "";

    chat.scrollTop = chat.scrollHeight;
}

function newChat() {
    document.getElementById("chat").innerHTML = `
        <div class="message">
            New conversation started.
        </div>
    `;
}
</script>

</body>
</html>
